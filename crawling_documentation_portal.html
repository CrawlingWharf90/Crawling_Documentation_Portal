<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation</title>
  <style>
    :root {
      --bg: #121215;
      --side: #19191e;
      --card: #202027;
      --code: #0c0c0f;
      --bd: #2d2d37;
      --tx: #ececf1;
      --mu: #9ca3af;
      --ac: #3b82f6;
      --dg: #f59e0b
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    [hidden] {
      display: none !important
    }

    body {
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--tx);
      display: flex;
      height: 100vh;
      overflow: hidden
    }

    button,
    select,
    input {
      font: inherit;
      color: inherit
    }

    aside {
      width: 300px;
      background: var(--side);
      border-right: 1px solid var(--bd);
      display: flex;
      flex-direction: column;
      flex-shrink: 0
    }

    .brand {
      padding: 14px 16px;
      border-bottom: 1px solid var(--bd);
      cursor: pointer
    }

    .brand b {
      display: block;
      font-size: 15.5px;
      color: #fff
    }

    .brand small {
      font-size: 11.5px;
      color: var(--mu)
    }

    .sw {
      padding: 12px 14px 8px
    }

    #q {
      width: 100%;
      padding: 8px 11px;
      background: var(--code);
      border: 1px solid var(--bd);
      border-radius: 6px;
      font-size: 13px;
      outline: 0
    }

    #q:focus {
      border-color: var(--ac)
    }

    .st {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--mu);
      margin-top: 6px
    }

    .st a {
      color: var(--ac);
      cursor: pointer
    }

    #tree {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 20px;
      user-select: none
    }

    .dom {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      padding: 12px 10px 6px;
      border-radius: 6px
    }

    .dom.design {
      color: var(--dg)
    }

    .dom.scripting {
      color: var(--ac)
    }

    em {
      font-style: normal;
      font-size: 10px;
      color: var(--mu);
      font-weight: 400
    }

    .none {
      font-size: 12px;
      color: var(--mu);
      padding: 2px 12px
    }

    summary {
      list-style: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
      color: #d4d4d8;
      cursor: pointer;
      display: flex;
      gap: 7px;
      align-items: center
    }

    summary::-webkit-details-marker {
      display: none
    }

    summary i {
      font-style: normal;
      font-size: 9px;
      width: 10px;
      color: var(--mu);
      transition: transform .15s
    }

    details[open]>summary i {
      transform: rotate(90deg)
    }

    summary em {
      margin-left: auto
    }

    summary:hover,
    .item:hover {
      background: rgba(255, 255, 255, .05);
      color: #fff
    }

    .kids {
      padding-left: 12px;
      margin-left: 12px;
      border-left: 1px solid rgba(255, 255, 255, .08)
    }

    .item {
      display: block;
      width: 100%;
      text-align: left;
      background: 0;
      border: 0;
      color: #d1d5db;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin: 1px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .item.on {
      background: rgba(59, 130, 246, .16);
      color: #fff;
      font-weight: 600;
      box-shadow: inset 3px 0 var(--ac)
    }

    .item.on.design {
      background: rgba(245, 158, 11, .15);
      box-shadow: inset 3px 0 var(--dg)
    }

    .over {
      outline: 1px dashed var(--ac);
      background: rgba(59, 130, 246, .14) !important
    }

    .foot {
      padding: 10px 14px;
      border-top: 1px solid var(--bd);
      display: flex;
      gap: 6px
    }

    .foot #add {
      flex: 1
    }

    .btn,
    .foot button,
    .ma button {
      background: var(--card);
      border: 1px solid var(--bd);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer
    }

    .btn:hover,
    .foot button:hover,
    .ma button:hover {
      border-color: var(--ac)
    }

    .pri {
      background: var(--ac) !important;
      border-color: var(--ac) !important;
      color: #fff !important
    }

    .big {
      padding: 10px 20px !important;
      font-size: 14px !important;
      margin-top: 18px
    }

    main {
      flex: 1;
      overflow-y: auto
    }

    #view {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 48px 80px
    }

    .crumb {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--mu);
      margin-bottom: 8px
    }

    .lead {
      color: var(--mu);
      font-size: 15.5px;
      margin-top: 6px
    }

    .hero h1,
    .md h1 {
      font-size: 30px;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 14px
    }

    .md h2 {
      font-size: 21px;
      margin: 30px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--bd);
      color: #fff
    }

    .md h3 {
      font-size: 16.5px;
      margin: 22px 0 8px;
      color: #fff
    }

    .md h4,
    .md h5,
    .md h6 {
      margin: 18px 0 6px;
      color: #e5e7eb
    }

    .md p,
    .md ul,
    .md ol,
    .md blockquote,
    .md pre,
    .md table {
      margin-bottom: 14px
    }

    .md ul,
    .md ol {
      padding-left: 24px
    }

    .md a {
      color: #93c5fd
    }

    .md code {
      background: var(--code);
      border: 1px solid var(--bd);
      padding: 1px 5px;
      border-radius: 4px;
      font: 12.5px Consolas, "Cascadia Mono", monospace
    }

    .md pre {
      position: relative;
      background: var(--code);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto
    }

    .md pre code {
      border: 0;
      padding: 0;
      background: 0;
      white-space: pre
    }

    .copy {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 4px;
      color: var(--mu);
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer
    }

    .copy:hover {
      color: #fff;
      border-color: var(--ac)
    }

    .md blockquote {
      border-left: 3px solid var(--ac);
      background: var(--card);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      color: #d1d5db
    }

    .md table {
      border-collapse: collapse;
      display: block;
      overflow-x: auto
    }

    .md th,
    .md td {
      border: 1px solid var(--bd);
      padding: 6px 12px;
      text-align: left
    }

    .md th {
      background: var(--card)
    }

    .md img {
      max-width: 100%;
      border-radius: 6px
    }

    .md hr {
      border: 0;
      border-top: 1px solid var(--bd);
      margin: 24px 0
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-top: 26px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-top: 3px solid var(--ac);
      border-radius: 10px;
      padding: 20px
    }

    .card.design {
      border-top-color: var(--dg)
    }

    .card h2 {
      font-size: 18px
    }

    .card p {
      color: var(--mu);
      font-size: 13px;
      margin: 2px 0 10px
    }

    .card li {
      list-style: none
    }

    .card button {
      background: 0;
      border: 0;
      color: #93c5fd;
      cursor: pointer;
      padding: 3px 0;
      text-align: left
    }

    .card button:hover {
      color: #fff
    }

    .hit {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      cursor: pointer
    }

    .hit:hover {
      border-color: var(--ac)
    }

    .hit b {
      display: block;
      color: #93c5fd
    }

    .hit small {
      color: var(--mu)
    }

    .hit div {
      font-size: 13px;
      color: var(--mu);
      margin-top: 4px
    }

    mark {
      background: rgba(245, 158, 11, .3);
      color: #fff;
      border-radius: 2px
    }

    .mb {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: grid;
      place-items: center;
      z-index: 9
    }

    .mc {
      background: var(--side);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 22px;
      width: min(470px, 92vw)
    }

    .mc label {
      display: block;
      font-size: 12px;
      color: var(--mu);
      margin-top: 12px
    }

    .mc select,
    .mc input:not([type=radio]) {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 7px 10px;
      background: var(--code);
      border: 1px solid var(--bd);
      border-radius: 6px;
      font-size: 13px
    }

    .mc #pn {
      margin-top: 8px
    }

    .mc .opt {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: var(--tx);
      font-size: 13px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 10px 12px
    }

    .mc .opt input {
      margin-top: 5px
    }

    .hint {
      font-size: 12.5px;
      color: var(--mu);
      margin: 8px 0
    }

    .ma {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px
    }

    #toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--bd);
      padding: 9px 16px;
      border-radius: 8px;
      z-index: 10;
      font-size: 13px
    }

    @media(max-width:760px) {
      body {
        flex-direction: column
      }

      aside {
        width: 100%;
        height: 42vh
      }

      #view {
        padding: 24px 18px
      }

      .cards {
        grid-template-columns: 1fr
      }
    }

    summary {
      padding: 0 4px 0 6px
    }

    summary .item {
      flex: 1;
      margin: 1px 0
    }

    .item.v {
      color: var(--mu);
      font-style: italic;
      cursor: default
    }

    .mw {
      position: relative
    }

    #menu {
      position: absolute;
      bottom: calc(100% + 6px);
      right: 0;
      min-width: 176px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 4px;
      z-index: 5;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, .4)
    }

    #menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: 0;
      border: 0;
      padding: 8px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500
    }

    #menu button:hover {
      background: rgba(255, 255, 255, .07)
    }

    .mc.wide {
      width: min(680px, 94vw);
      max-height: 86vh;
      display: flex;
      flex-direction: column
    }

    .help {
      overflow: auto;
      margin-top: 6px;
      padding-right: 6px
    }

    .help h4 {
      margin: 14px 0 4px;
      color: #fff;
      font-size: 14px
    }

    .help li {
      font-size: 13px;
      color: #d1d5db;
      margin-bottom: 3px
    }

    .help ul {
      padding-left: 20px
    }

    kbd {
      background: var(--card);
      border: 1px solid var(--bd);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 0 6px;
      font: 12px Consolas, monospace
    }

    #arr {
      overflow: auto;
      flex: 1;
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 8px;
      background: var(--code);
      min-height: 240px
    }

    .ah {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 8px 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px dashed var(--bd);
      color: var(--mu)
    }

    .ah.zc {
      border-color: var(--ac);
      background: rgba(59, 130, 246, .15);
      color: #fff
    }

    .ar {
      padding: 6px 10px;
      border-radius: 6px;
      margin: 2px 0;
      cursor: grab;
      background: var(--card);
      border: 1px solid transparent;
      font-size: 13px
    }

    .ar.lk {
      cursor: default;
      opacity: .7;
      background: transparent
    }

    .ar.nw {
      background: rgba(59, 130, 246, .22);
      border-color: var(--ac);
      color: #fff;
      font-weight: 600;
      opacity: 1
    }

    .ar.zb {
      border-top: 2px solid var(--ac)
    }

    .ar.za {
      border-bottom: 2px solid var(--ac)
    }

    .ar.zc {
      outline: 2px dashed var(--ac)
    }

    .ak {
      margin-left: 20px;
      border-left: 1px solid var(--bd);
      padding-left: 8px
    }

    .md details {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 14px
    }

    .md summary {
      display: list-item;
      list-style: revert;
      padding: 0;
      font-weight: 600;
      cursor: pointer
    }

    .md summary::-webkit-details-marker {
      display: revert
    }

    .md summary:hover {
      background: 0
    }

    .md center {
      display: block;
      text-align: center;
      margin-bottom: 14px
    }

    .md mark {
      color: #fff
    }

    .md kbd {
      font-size: 12px
    }

    div.tex {
      overflow-x: auto;
      margin: 0 0 14px;
      text-align: center
    }

    .tex .katex {
      font-size: 1.08em
    }

    .md .mermaid { background: var(--code); border: 1px solid var(--bd); border-radius: 8px; padding: 14px; margin-bottom: 14px; text-align: center; overflow-x: auto; white-space: pre; font: 12.5px Consolas, monospace; color: var(--mu) }
    .md .mermaid svg { max-width: 100%; height: auto; display: block; margin: 0 auto }
    .md .mermaid.texerr { color: var(--dg) }
    .texerr {
      font-family: Consolas, monospace;
      color: var(--dg)
    }

    .md .sheet {
      overflow: auto;
      max-height: 72vh;
      border: 1px solid var(--bd);
      border-radius: 8px;
      margin-bottom: 14px
    }

    .md .sheet table {
      display: table;
      border-collapse: separate;
      border-spacing: 0;
      margin: 0;
      font-size: 13px;
      width: max-content;
      min-width: 100%
    }

    .md .sheet th,
    .md .sheet td {
      border: 0;
      border-right: 1px solid var(--bd);
      border-bottom: 1px solid var(--bd);
      padding: 4px 10px;
      white-space: nowrap;
      text-align: left
    }

    .md .sheet thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #26262e;
      color: var(--mu);
      font-size: 11px;
      text-align: center
    }

    .md .sheet tbody th {
      position: sticky;
      left: 0;
      background: #26262e;
      color: var(--mu);
      font-size: 11px;
      text-align: center
    }

    .md .sheet td.n {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .md .sheet td.er {
      color: #f87171
    }

    .md .sheet tr.hd td {
      background: var(--card);
      font-weight: 700;
      color: #fff
    }
    .dom.art{color:#c084fc}.item.on.art{background:rgba(192,132,252,.15);box-shadow:inset 3px 0 #c084fc}.card.art{border-top-color:#c084fc}
    .brand:focus-visible{outline:1px solid var(--ac);outline-offset:-2px}
    .aw{position:relative;flex:1}.aw #add{width:100%}
    #addmenu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;z-index:5;box-shadow:0 -6px 20px rgba(0,0,0,.4)}
    #addmenu button{display:block;width:100%;text-align:left;background:0;border:0;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:500}
    #addmenu button:hover{background:rgba(255,255,255,.07)}
  </style>
</head>

<body>
  <aside>
    <div class="brand" id="brand" tabindex="0" title="Home · press F2 to rename the project"><b id="bn">Documentation</b><small>Design · Art · Scripting</small></div>
    <div class="sw">
      <input id="q" type="search" placeholder="Search docs (press /)" autocomplete="off">
      <div class="st"><span id="count">Loading…</span><a id="tgl">Expand/Collapse</a></div>
    </div>
    <div id="tree"></div>
    <div class="foot"><div class="aw"><button id="add" class="pri">➕ Add docs ▴</button><div id="addmenu" hidden><button data-add="up">📁 Upload Local File</button><button data-add="new">📄 New File</button></div></div>
      <div class="mw"><button id="mbtn" title="Refresh, reorganize, help">☰ ▴</button>
        <div id="menu" hidden><button data-a="refresh">↻ Refresh</button><button data-a="reorg">⇅
            Reorganize</button><button data-a="ide">💻 Editor settings</button><button data-a="help">❓ Help</button>
        </div>
      </div>
    </div>
  </aside>
  <main>
    <div id="view"></div>
  </main>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
  <input type="file" id="pick" accept=".md,.markdown" multiple hidden>

  <script>
    /* ============================================================
       Docs portal — layout on disk (this file lives at the docs root):
         _manifest.json   mode + file list (folders) or tree (single folder)
         Design/ Scripting/   <- "folders" mode: directories ARE the hierarchy
         pages/               <- "single folder" mode: flat folder, hierarchy lives in the manifest
       Pages are fetched lazily, rendered at runtime, never baked into this HTML.
       ============================================================ */
    const $ = s => document.querySelector(s);
    const DOM = ['design', 'art', 'scripting'], DT = { design: 'Design', art: 'Art', scripting: 'Scripting' }, IC = { design: '🎨', art: '🖌️', scripting: '💻' };
    const mkT = () => Object.fromEntries(DOM.map(d => [d, []])), allN = T => DOM.flatMap(d => T[d]);
    const S = { name: '', mode: null, files: [], tree: null, T: null, root: null, pending: null, cache: new Map(), ip: null, cur: null, open: new Set(), all: false, tk: 0, drag: null };
    const KEY = 'root:' + location.pathname;
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const nat = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    const clean = s => s.replace(/^\d+[\s._-]+/, '');
    const lab = s => clean(s.replace(/_+/g, ' '));
    const pretty = f => lab(f.replace(/\.[^.]+$/, '').replace(/-+/g, ' ')).trim() || f;
    const L = n => S.mode === 'singleFolder' && n.file ? n.name : pretty(n.name);
    const srt = l => S.mode === 'singleFolder' ? l : [...l].sort((a, b) => nat(a.name, b.name));
    const cnt = l => l.reduce((a, n) => a + (n.file ? 1 : 0) + cnt(n.children), 0);
    const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3500) };

    /* ---------- persistence of the folder handle ---------- */
    const idb = (m, k, v) => new Promise((ok, no) => {
      const o = indexedDB.open('docs-portal', 1); o.onupgradeneeded = () => o.result.createObjectStore('h'); o.onerror = () => no(o.error);
      o.onsuccess = () => { const s = o.result.transaction('h', m === 'get' ? 'readonly' : 'readwrite').objectStore('h'); const r = m === 'get' ? s.get(k) : s.put(v, k); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error) }
    });

    /* ---------- file access (File System Access API when connected, fetch otherwise) ---------- */
    const dirAt = async (s, c) => { let d = S.root; for (const x of s) d = await d.getDirectoryHandle(x, { create: !!c }); return d };
    const fh = async (p, c) => { const s = p.split('/'), f = s.pop(); return (await dirAt(s, c)).getFileHandle(f, { create: !!c }) };
    async function read(p, fresh) {
      if (!fresh && S.cache.has(p)) return S.cache.get(p);
      let t;
      if (S.root) t = await (await (await fh(p)).getFile()).text();
      else { if (location.protocol === 'file:') throw 0; const r = await fetch(encodeURI(p), { cache: 'no-cache' }); if (!r.ok) throw 0; t = await r.text() }
      if (!fresh) S.cache.set(p, t); return t
    }
    async function write(p, data) { const w = await (await fh(p, 1)).createWritable(); await w.write(data); await w.close() }
    async function walk(d, pre, out, all) {
      for await (const [n, h] of d.entries()) {

    function sheet(txt, hd) {

    /* ---------- LaTeX: KaTeX is loaded lazily, only for pages that contain math (local copy in _vendor/katex/ wins over the CDN) ---------- */
    let kx;
    function loadKatex() {
      return kx ??= new Promise((ok, no) => {
        const bases = ['_vendor/katex/', 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/'];
        const go = i => {

          const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = bases[i] + 'katex.min.css'; document.head.append(l);

    }
    // <style> in a doc applies to that page only: selectors are prefixed with the page area, and body/html/:root mean the page area itself
    function scopeCss(css) {
      const bad = /url\(|expression|behavior|javascript:|-moz-binding|@import/i;
      const sc = x => { if (/^(from|to|[\d.]+%)$/i.test(x)) return x; const r = x.replace(/^(?:html\s*)?(?:body|html|:root)(?![\w-])/i, '').trim(); return '#view .md' + (r ? ' ' + r : '') };

        .replace(/([^{}@]+)\{([^{}]*)\}/g, (m, sel, body) => sel.split(',').map(x => x.trim()).filter(Boolean).map(sc).join(',') + '{' + body.split(';').filter(x => x.trim() && !bad.test(x)).join(';') + '}')
    }

    /* ---------- Mermaid diagrams: loaded lazily, local copy in _vendor/mermaid/ wins over the CDN ---------- */

    const resolve = (from, rel) => { const b = from.split('/').slice(0, -1); for (const s of rel.split('/')) { if (s === '..') b.pop(); else if (s && s !== '.') b.push(s) } return b.join('/') };

    /* ---------- lazy search: index is built on first use, then cached ---------- */
    function ensureIdx() {

    async function search(q) {
      q = q.trim().toLowerCase();

      if (!S.T) return;
      const w = q.split(/\s+/), idx = await ensureIdx();
      if ($('#q').value.trim().toLowerCase() !== q) return;
      const re = new RegExp('(' + w.map(rx).join('|') + ')', 'gi');
      const hits = idx.filter(p => w.every(x => p.l.includes(x) || p.tl.includes(x)))
        .map(p => ({ p, s: w.reduce((a, x) => a + (p.tl.includes(x) ? 10 : 1), 0) })).sort((a, b) => b.s - a.s).slice(0, 40);
      S.tk++;
      $('#view').innerHTML = `<div class="crumb">Search</div><h1 style="font-size:24px;margin-bottom:16px">${hits.length} result${hits.length === 1 ? '' : 's'} for “${esc(q)}”</h1>` +
        hits.map(({ p }) => {

    }

    /* ---------- working tree + arrange GUI (drag a page onto another: middle = child, top/bottom edge = sibling) ---------- */

    function arrange(title, hint, W, mv, okLabel, done) {

    /* ---------- commit: apply a working tree to disk, then implicit refresh ---------- */
    async function commit(W) {
      if (!await ensureWrite()) throw new Error('Docs folder is not connected');
      S.mode === 'singleFolder' ? await commitManual(W) : await commitFolders(W);
      await load()
    }

    async function commitManual(W) {
      const all = flat(allN(W)), keep = new Set(all.map(n => n.file).filter(Boolean));
      for (const n of all) if (n._new) { const p = await uniq(['pages'], n._new.nm); await write(p, n._new.text); n.file = p; delete n._new }
      const pd = await dirAt(['pages']);
      for (const o of flat(allN(S.T))) if (o.file && !keep.has(o.file)) try { await pd.removeEntry(o.file.split('/').pop()) } catch { }
      S.tree = Object.fromEntries(DOM.map(d => [d, strip(W[d])])); await save()
    }

    async function commitFolders(W) {
      const ev = []; for (const d of DOM) { try { await walk(await dirAt([DT[d]]), DT[d] + '/', ev, 1) } catch { } }
      const E = new Set(ev), EL = new Set(ev.map(x => x.toLowerCase())), oldN = flat(allN(S.T)), wN = [];
      // 1) target location of every node in the new tree: children go in a folder named after their parent
      const plan = (l, dir) => {
        for (const n of l) {
          let base, ext = '';
          if (n.key) { base = n.rn || n.key.split('/').pop(); ext = n.file ? n.file.slice(n.key.length) : '' }
          else { ext = n._new.nm.match(/\.[^.]+$/)?.[0] || ''; const b0 = n._new.nm.slice(0, n._new.nm.length - ext.length); base = b0; for (let i = 1; E.has(dir + base + ext);)base = `${b0}_${++i}`; E.add(dir + base + ext) }
          n.tk = dir + base; n.ext = ext; wN.push(n); plan(n.children, n.tk + '/')
        }
      };
      DOM.forEach(d => plan(W[d], DT[d] + '/'));
      // 2) which files move or go away (a page's images move with it; images of a deleted page are deleted)
      const by = new Map(wN.filter(n => n.key).map(n => [n.key, n])), pf = new Set(oldN.map(n => n.file).filter(Boolean)), moves = [], dels = [];
      for (const o of oldN) if (o.file) { const w = by.get(o.key); if (!w) dels.push(o.file); else if (w.tk + w.ext !== o.file) moves.push([o.file, w.tk + w.ext]) }
      for (const p of ev) {
        if (pf.has(p)) continue;
        let ow = null; for (const o of oldN) if (p.startsWith(o.key + '/') && (!ow || o.key.length > ow.key.length)) ow = o;
        if (!ow) continue; const w = by.get(ow.key);
        if (!w) dels.push(p); else { const np = w.tk + p.slice(ow.key.length); if (np !== p) moves.push([p, np]) }
      }
      for (const [o, n] of moves) if ((E.has(n) || EL.has(n.toLowerCase())) && n !== o) throw new Error('Target already exists: ' + n);
      // 3) copy first, delete last, so a failure never loses a file
      for (const n of wN) if (n._new) { await write(n.tk + n.ext, n._new.text); n.file = n.tk + n.ext; delete n._new }
      for (const [o, n] of moves) await write(n, await (await fh(o)).getFile());
      const gone = [...moves.map(m => m[0]), ...dels];
      for (const p of gone) { const s = p.split('/'), f = s.pop(); await (await dirAt(s)).removeEntry(f) }
      const ds = new Set(); for (const p of gone) { const s = p.split('/').slice(0, -1); while (s.length > 1) { ds.add(s.join('/')); s.pop() } }
      for (const d of [...ds].sort((a, b) => b.length - a.length)) { const s = d.split('/'), n = s.pop(); try { await (await dirAt(s)).removeEntry(n) } catch { } }
      const mv = new Map(moves); if (mv.has(S.cur)) { S.cur = mv.get(S.cur); location.hash = '#' + encodeURIComponent(S.cur) }
    }

        await commit(W); toast('Renamed')
      });
      const i = $('#rn'); i.focus(); i.select(); i.onkeydown = e => { if (e.key === 'Enter') $('#modal [data-ok]').click() }
    }

    /* ---------- open in IDE (F4): editors register URL handlers, e.g. vscode://file/<path> ---------- */
    const IDES = { vs: ['VS Code', p => 'vscode://file' + p], vi: ['VS Code Insiders', p => 'vscode-insiders://file' + p], cu: ['Cursor', p => 'cursor://file' + p], vc: ['VSCodium', p => 'vscodium://file' + p] };
    const cfgGet = () => { try { return JSON.parse(localStorage.getItem('docs-ide')) } catch { return null } };
    const cfgSet = c => { try { localStorage.setItem('docs-ide', JSON.stringify(c)) } catch { } };
    // opened from Unity (file://) the portal knows its own absolute folder; over http the user types it once
    const docsRoot = c => location.protocol === 'file:' ? decodeURIComponent(location.pathname).replace(/\/[^/]*$/, '').replace(/^\/(?=[A-Za-z]:)/, '') : (c.root || '').replace(/\\/g, '/').replace(/\/+$/, '');
    function openIde() {
      const c = cfgGet(); if (!c || !S.cur) return ideDialog(true);
      const root = docsRoot(c); if (!root) return ideDialog(true);
      const ap = root + '/' + S.cur, u = c.ide === 'custom' ? c.tpl.replaceAll('{path}', encodeURI(ap)).replaceAll('{enc}', encodeURIComponent(ap)) : IDES[c.ide][1](encodeURI((ap[0] === '/' ? '' : '/') + ap));
      const a = document.createElement('a'); a.href = u; a.click();
      toast(`Opening in ${c.ide === 'custom' ? 'your editor' : IDES[c.ide][0]}… allow the browser prompt if it asks`)
    }
    function ideDialog(go) {
      const c = cfgGet() || { ide: 'vs', tpl: '', root: '' }, web = location.protocol !== 'file:';
      modal('Editor settings', `<p class="hint">F4 opens the selected page in your editor through its URL handler, so the editor must be installed.</p>
    <label>Editor<select id="ie">${Object.entries(IDES).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}<option value="custom">Other (custom URL)…</option></select></label>
    <input id="it" placeholder="URL template, e.g. rider://open?file={enc}" value="${esc(c.tpl)}" hidden>
    ${web ? `<label>Absolute path of this docs folder<input id="ir" placeholder="C:/path/to/your/docs/folder" value="${esc(c.root)}"></label>` : ''}
    <p class="hint">Custom templates can use <code>{path}</code> (plain path) or <code>{enc}</code> (URL-encoded path).</p>`, 'Save', async r => {
        const ide = r.querySelector('#ie').value, tpl = r.querySelector('#it').value.trim(), root = r.querySelector('#ir')?.value.trim() || '';
        if (ide === 'custom' && !/\{(path|enc)\}/.test(tpl)) throw new Error('The template needs {path} or {enc}');
        if (web && !root) throw new Error('Enter the docs folder path');
        cfgSet({ ide, tpl, root }); if (go && S.cur) setTimeout(openIde)
      });
      const ie = $('#ie'); ie.value = c.ide; const sh = () => $('#it').hidden = ie.value !== 'custom'; sh(); ie.onchange = sh
    }

    async function reorganize() {
      if (!S.T || !await ensureWrite() || !S.T) return;
      const W = cloneT(S.T), s0 = sig(W);
      arrange('Reorganize docs', `Drag any page: drop in the middle of another page to make it a <b>child</b>, on its top/bottom edge to make it a <b>sibling</b>, or on a section bar for the top level.${S.mode === 'folders' ? ' Folders mode moves the files on disk (siblings stay alphabetical); relative links inside moved pages are not rewritten.' : ''}`, W, () => true, 'Apply', async W => {
        if (sig(W) === s0) { toast('No changes'); return }
        await commit(W); toast('Docs reorganized')
      })
    }

    function help() {
      modal('How to use these docs', `<div class="help">
  <h4>Browsing</h4><ul><li>Use the tree on the left: <b>Design</b>, <b>Art</b> and <b>Scripting</b> hold pages, and any page can have child pages (click the ▶ to expand).</li>
  <li>Press <kbd>/</kbd> to search. The first search indexes all pages, then it is instant. Click a result to open it.</li>
  <li>Links between pages (<code>[text](other.md)</code>) work, and every page has its own address, so you can bookmark it.</li></ul>
  <h4>Adding pages</h4><ul><li>Click <b>➕ Add docs</b> and choose <b>Upload Local File</b> (or drop <code>.md</code> files onto the window), or <b>New File</b> to start from a template: give the page a name and it is created for you.</li><li>Templates are the <code>.md</code> files in <code>Resources/Markdown</code> (with more than one you pick which; <code>{{title}}</code> inside a template is replaced by the name). Create templates in Unity with <b>Tools → Docs → Create Docs File Template</b>.</li>
  <li>Choose the section, then <b>Top level</b> (no parent) or <b>Sub level</b>.</li>
  <li><b>Sub level</b> opens a window: drag the highlighted page onto another page — middle = child, top/bottom edge = sibling — then press <b>Add here</b>.</li>
  <li>The portal refreshes by itself afterwards. The portal copies your file, so keep editing the copy inside the docs folder.</li></ul>
  <h4>Editing</h4><ul><li>Open (select) a page and press <kbd>F4</kbd> to edit its <code>.md</code> file in your IDE. The first time you pick which editor (change it later in <b>☰ → Editor settings</b>). Save, switch back to the browser, and the page reloads by itself.</li></ul>
  <h4>Deleting</h4><ul><li>Open (select) a page and press <kbd>Del</kbd>. You always get a confirmation, and if the page has children you choose to keep them (they move up) or delete them too.</li></ul>
  <h4>Renaming</h4><ul><li>To rename the <b>project</b>, click its name at the top of the sidebar (or open the home page) and press <kbd>F2</kbd>; it is saved in the manifest for the whole team.</li><li>Open (select) a page and press <kbd>F2</kbd>. <b>Single Folder mode</b> changes the title shown in the tree. <b>Folders mode</b> renames the file on disk (with its children folder and images); keep the number prefix to keep the order.</li></ul>
  <h4>Reorganizing</h4><ul><li><b>☰ → Reorganize</b> opens the same drag-and-drop window with every page movable. Press <b>Apply</b> to save.</li>
  <li><b>Single Folder mode</b> stores the order in the manifest. <b>Folders mode</b> moves files on disk (children into a folder named after their parent) and sorts siblings alphabetically — prefix names with numbers (<code>01_Intro.md</code>) to control the order.</li></ul>
  <h4>Refresh</h4><ul><li><b>☰ → Refresh</b> re-reads the folder. Use it after editing in your IDE or after a <code>git pull</code>.</li></ul>
  <h4>Rich content</h4><ul><li><b>HTML</b> works inside pages (tables, <code>&lt;details&gt;</code>, images, <code>style</code> colours). A <code>&lt;style&gt;</code> block works too but only affects that page (<code>body</code> means the page area). Scripts and unsafe attributes are removed, and markdown is not parsed inside an HTML block.</li>
  <li><b>Diagrams:</b> a code block whose language is <code>mermaid</code> (flowcharts, sequence diagrams, ...) is drawn with Mermaid, loaded on first use; put a copy in <code>_vendor/mermaid/</code> to work offline.</li>
  <li><b>Math:</b> <code>$E=mc^2$</code> inline or <code>$$ ... $$</code> as a centred block (KaTeX). It loads on first use; put a copy in <code>_vendor/katex/</code> to work offline. A lone price like <code>$5</code> is left alone; write <code>&#92;$</code> for a literal dollar before another one.</li>
  <li><b>Spreadsheets:</b> use a code block whose language is <code>sheet</code> (add <code>header</code> after it to style the first row). Paste straight from Excel (tab-separated), or write rows with <code>|</code> or commas. Start a cell with <code>=</code> for a formula: <code>+ - * / ^ %</code>, comparisons, cells like <code>B2</code>, ranges like <code>B2:B9</code>, and SUM, AVERAGE, MIN, MAX, COUNT, PRODUCT, ROUND, FLOOR, CEIL, ABS, SQRT, POW, MOD, LOG, LN, EXP, IF, AND, OR, NOT. Hover a result to see its formula.</li></ul>
  <h4>Shortcuts</h4><ul><li><kbd>/</kbd> search · <kbd>F2</kbd> rename page / project · <kbd>F4</kbd> edit in IDE · <kbd>Del</kbd> delete (they act on the page that is open).</li></ul>
  <h4>Good to know</h4><ul><li>Commit the whole docs folder, including <code>_manifest.json</code>. Each teammate connects the folder once, in Chrome or Edge.</li>
  <li>Images next to a page work with relative paths, e.g. <code>![](img/shot.png)</code>.</li></ul></div>`, 'Close', () => { }, { wide: 1, one: 1 })
    }

    /* ---------- wiring ---------- */
    addEventListener('dragover', e => { if (e.dataTransfer?.types.includes('Files')) e.preventDefault() });
    addEventListener('drop', e => { if (e.dataTransfer?.files.length) { e.preventDefault(); addFiles(e.dataTransfer.files) } });
    document.addEventListener('click', e => {
      const t = e.target; let el;
      if (!t.closest('.mw')) $('#menu').hidden = true;
      if (!t.closest('.aw')) $('#addmenu').hidden = true;
      if (el = t.closest('[data-add]')) { $('#addmenu').hidden = true; return el.dataset.add === 'up' ? $('#pick').click() : newFile() }
      if (t.closest('#mbtn')) { $('#menu').hidden = !$('#menu').hidden; return }
      if (el = t.closest('[data-a]')) { $('#menu').hidden = true; const a = el.dataset.a; return a === 'refresh' ? load().then(() => toast('Refreshed')) : a === 'reorg' ? reorganize() : a === 'ide' ? ideDialog(false) : help() }
      if (el = t.closest('[data-open]')) { const sm = el.closest('summary'); if (sm) { e.preventDefault(); sm.parentElement.open = true } return openPage(el.dataset.open) }
      if (el = t.closest('[data-reveal]')) return reveal(el.dataset.reveal);
      if (el = t.closest('[data-copy]')) { navigator.clipboard.writeText(el.nextElementSibling.textContent); el.textContent = 'Copied!'; setTimeout(() => el.textContent = 'Copy', 1200); return }
      if (el = t.closest('#view a[href]')) {
        const h = el.getAttribute('href'); if (/^(https?:|mailto:)/.test(h)) return;
        e.preventDefault(); const p = h.split('#')[0]; if (/\.md$/i.test(p)) openPage(resolve(S.cur || '', decodeURI(p)))
      }
    });
    document.addEventListener('toggle', e => { const k = e.target.dataset?.k; if (k) e.target.open ? S.open.add(k) : S.open.delete(k) }, true);

    $('#brand').onclick = () => S.T && home();
    $('#brand').ondblclick = () => S.T && nameDialog(false);
    $('#tgl').onclick = () => { S.all = !S.all; S.open.clear(); document.querySelectorAll('details.fold').forEach(d => d.open = S.all) };
    $('#add').onclick = async () => {
      if (!S.root) { if (await ensureWrite()) toast('Folder connected — click Add docs again'); return }
      if (S.T) $('#addmenu').hidden = !$('#addmenu').hidden
    };
    $('#pick').onchange = e => { addFiles(e.target.files); e.target.value = '' };
    let st; $('#q').oninput = e => { clearTimeout(st); st = setTimeout(() => search(e.target.value), 180) };
    $('#q').onfocus = () => { if (S.T) ensureIdx() };
    addEventListener('focus', async () => { // coming back from the IDE: reload the open page if it changed
      if (!S.cur || !S.T) return; const f = S.cur, old = S.cache.get(f); S.cache.delete(f);
      try { const t = await read(f); if (t !== old && f === S.cur) { S.ip = null; const y = $('main').scrollTop; await openPage(f, 1); $('main').scrollTop = y } } catch { }
    });
    addEventListener('hashchange', () => { if (!S.T) return; const f = decodeURIComponent(location.hash.slice(1)); f ? f !== S.cur && openPage(f, 1) : home() });
    addEventListener('keydown', e => {
      const a = document.activeElement.tagName, free = !/INPUT|SELECT|TEXTAREA/.test(a), mo = !$('#modal').hidden;
      if (e.key === '/' && free && !mo) { e.preventDefault(); $('#q').focus() }
      if (e.key === 'Delete' && free && !mo && S.cur && S.T) del();
      if (e.key === 'F2' && free && !mo && S.T) { e.preventDefault(); (document.activeElement.id === 'brand' || !S.cur) ? nameDialog(false) : rename() }
      if (e.key === 'F4' && free && !mo && S.cur && S.T) { e.preventDefault(); openIde() }
      if (e.key === 'Escape') { $('#menu').hidden = true; $('#addmenu').hidden = true; if (mo && !$('#modal').dataset.nc) $('#modal').hidden = true }
    });

    (async () => {
      try { const h = await idb('get', KEY); if (h) { if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') S.root = h; else S.pending = h } } catch { }
      await load()
    })();
  </script>
</body>

</html>
